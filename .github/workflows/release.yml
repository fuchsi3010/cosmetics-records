name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (empty = version from pyproject.toml)'
        required: false
        type: string
        default: ''

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: CosmeticsRecords-Windows.exe
            built: dist/CosmeticsRecords.exe
          - os: ubuntu-latest
            artifact: CosmeticsRecords-Linux
            built: dist/CosmeticsRecords
          - os: macos-latest
            artifact: CosmeticsRecords-macOS.zip
            built: dist/CosmeticsRecords-macOS.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build
        run: pyinstaller cosmetics_records.spec

      - name: Zip macOS app bundle
        if: runner.os == 'macOS'
        run: cd dist && zip -r CosmeticsRecords-macOS.zip CosmeticsRecords.app

      - name: Rename artifact
        if: runner.os != 'macOS'
        shell: bash
        run: mv "${{ matrix.built }}" "dist/${{ matrix.artifact }}" || true

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="$(grep -m1 'version = ' pyproject.toml | cut -d'"' -f2)"
          fi
          echo "tag=v${VERSION#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          draft: true
          prerelease: ${{ contains(steps.version.outputs.tag, '-') }}
          files: dist/*
